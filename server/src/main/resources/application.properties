
# ==========================================
# Application Configuration
# ==========================================
spring.application.name=garud-network-operations


# ==========================================
# PostgreSQL Database Configuration
# ==========================================
spring.datasource.url=${GNO_DB_URL:jdbc:postgresql://localhost:5432/garud_network}
spring.datasource.username=${GNO_DB_USERNAME:user}
spring.datasource.password=${GNO_DB_PASSWORD:user@123}
spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================================
# JPA and Hibernate Configuration
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Validate entity mappings against existing database schema
spring.jpa.hibernate.ddl-auto=validate

# Display SQL queries in console (development only)
spring.jpa.show-sql=true

# Format SQL queries for readability
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# Server Configuration
# ==========================================
server.port=8080
